apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 기존 resources 목록에 post-deploy.yaml 한 줄만 추가하면 된다.
resources:
  - secrets.yaml
  - post-deploy.yaml

# 별도 스크립트 파일을 동일한 이름의 ConfigMap으로 생성한다.
configMapGenerator:
  - name: ai-gateway-post-deploy-script
    namespace: ai-gateway
    files:
      - run.sh
      - wait_for_ready.py

# 스크립트 변경 시 같은 ConfigMap을 갱신한다. Job 재실행은 기존 Job을
# 삭제한 뒤 kubectl apply -k . 로 명시적으로 수행한다.
generatorOptions:
  disableNameSuffixHash: true
