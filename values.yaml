# Chart.yaml의 dependency 이름 아래에 기존 AI Gateway 값을 둔다.
ai-gateway:
  replicaCount: 2

  image:
    # 폐쇄망에 미러링된 실제 AI Gateway 이미지로 교체한다.
    repository: registry.example.internal/gitlab/ai-gateway
    tag: self-hosted-v19.2.0-ee
    pullPolicy: IfNotPresent

  gitlab:
    url: https://gitlab.example.internal/
    apiUrl: https://gitlab.example.internal/api/v4/

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
