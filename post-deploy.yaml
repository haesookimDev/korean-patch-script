# 이 파일 하나가 스크립트 실행에 필요한 모든 추가 리소스를 포함한다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway-post-deploy
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway-post-deploy
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-gateway-post-deploy
  namespace: ai-gateway
rules:
  # Ready 확인에 필요한 읽기 권한만 허용한다.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-gateway-post-deploy
  namespace: ai-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-gateway-post-deploy
subjects:
  - kind: ServiceAccount
    name: ai-gateway-post-deploy
    namespace: ai-gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-gateway-post-deploy
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway-post-deploy
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway-post-deploy
    spec:
      serviceAccountName: ai-gateway-post-deploy
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-script
          # values.yaml의 ai-gateway.image와 반드시 같은 사내 이미지/tag를 쓴다.
          image: registry.example.internal/gitlab/ai-gateway:self-hosted-v19.2.0-ee
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              python /opt/post-deploy/wait_for_ready.py
              exec /bin/sh /opt/post-deploy/run.sh
          env:
            - name: TARGET_NAMESPACE
              value: ai-gateway
            - name: TARGET_SELECTOR
              value: app.kubernetes.io/instance=ai-gateway
            - name: WAIT_TIMEOUT_SECONDS
              value: "840"
          envFrom:
            - secretRef:
                name: post-deploy-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /opt/post-deploy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: ai-gateway-post-deploy-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
